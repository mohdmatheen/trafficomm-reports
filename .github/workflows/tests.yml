name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: trafficomm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/trafficomm_test
      SECRET_KEY: ci-only-not-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System packages (same as deploy/Dockerfile)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc libreoffice-impress poppler-utils fonts-dejavu fonts-liberation fonts-crosextra-carlito
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests -q -p no:warnings
